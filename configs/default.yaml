project:
  name: psma_ct_to_pet_pix2pix
  seed: 42

paths:
  data_root: /cloud/cloud-ssd1/root
  train_ct_dir: ct_clipped_no_normed
  train_pet_dir: suv_clipped_no_normed
  val_ct_dir: ct_val
  val_pet_dir: pet_val
  staging_root: staging_cache
  checkpoint_dir: checkpoints
  run_dir: runs
  metrics_file: metrics.csv

data:
  image_size: 512
  slice_axis: 2
  skip_empty_slices: false
  empty_pet_threshold: 0.01
  max_train_slices: null
  max_val_slices: 64
  chunk_cases: 4
  max_cache_gb: 40
  val_visuals: 4

normalization:
  ct_min: -1000.0
  ct_max: 2000.0
  pet_min: 0.0
  pet_max: 50.0

model:
  in_channels: 1
  out_channels: 1
  base_channels: 64
  lambda_l1: 100.0
  gan_mode: lsgan

train:
  epochs: 1
  batch_size: 8
  lr: 0.0002
  beta1: 0.5
  beta2: 0.999
  device: auto
  amp: true
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  log_every: 10
  resume: true
  save_epoch_checkpoints: true
